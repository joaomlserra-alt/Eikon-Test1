name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleDebug --stacktrace

      - name: Reunir o APK
        run: |
          mkdir -p dist
          APK=$(find /tmp -path '*eikondiag-build*' -name '*.apk' | head -n1)
          echo "APK encontrado: $APK"
          cp "$APK" dist/EikonDiag.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EikonDiag-apk
          path: dist/EikonDiag.apk

      - name: Publicar numa Release (para descarregar do telemóvel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Eikon Diag (build ${{ github.run_number }})
          files: dist/EikonDiag.apk
